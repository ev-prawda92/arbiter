name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Unit and consistency tests
        run: python -m pytest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Curation gate
        run: python scripts/curation_gate.py

      - name: Operations Intelligence gate
        run: python scripts/operations_intelligence_gate.py

      - name: Decision Record gate
        run: python scripts/decision_record_gate.py

      - name: Decision Propagation gate
        run: python scripts/decision_propagation_gate.py

      - name: Decision API route gate
        run: python scripts/decision_api_route_gate.py

      - name: Decision Clearing gate
        run: python scripts/decision_clearing_gate.py

      - name: Venue Intake gate
        run: python scripts/venue_intake_gate.py

      - name: Precedent gate
        run: python scripts/precedent_gate.py

      - name: Audit trail gate
        run: python scripts/audit_trail_gate.py

      - name: Audit engagement gate
        run: python scripts/audit_engagement_gate.py

      - name: Demo mode gate
        run: python scripts/demo_mode_gate.py
      - name: Access gate
        run: python scripts/access_gate.py

      - name: Public API gate
        env:
          ARBITER_DATABASE_PATH: /tmp/arbiter-public.db
        run: |
          set -euo pipefail
          cd backend
          python -m uvicorn app.public:app --host 127.0.0.1 --port 8001 > /tmp/arbiter-public.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID || true' EXIT
          cd ..
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8001/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8001/health >/dev/null || { cat /tmp/arbiter-public.log; exit 1; }
          python scripts/public_api_gate.py

      - name: Full release gate
        env:
          ARBITER_DATABASE_PATH: /tmp/arbiter-main.db
        run: |
          set -euo pipefail
          cd backend
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/arbiter-main.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          cd ..
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health >/dev/null || { cat /tmp/arbiter-main.log; exit 1; }
          python scripts/release_gate.py

  deploy-image:
    name: Deploy image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t arbiter:ci .

      - name: Start the demo as render.yaml does and check health
        run: |
          docker run -d --name arbiter -p 8000:8000 \
            -e ARBITER_DEMO_MODE=1 \
            -e ARBITER_DATABASE_PATH=/app/backend/data/demo.db \
            -e ARBITER_POLICY_PATH=/app/backend/data/policy.json \
            arbiter:ci sh -c "python /app/scripts/seed_demo.py --db /app/backend/data/demo.db --force && exec python -m uvicorn app.server:app --host 0.0.0.0 --port 8000 --proxy-headers"
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs arbiter
          exit 1
